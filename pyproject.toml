[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heiban"
dynamic = ["version"]
description = "Markdown to Office (DOCX/PPTX/XLSX) converter with pure XML OOXML generation"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.8"
authors = [
    { name = "HeiBan Contributors" },
]
keywords = ["markdown", "docx", "pptx", "xlsx", "ooxml", "converter", "word", "powerpoint", "excel", "mermaid", "latex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Office/Business",
]

dependencies = [
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
pptx-hq = [
    "PyMuPDF>=1.23.0",
]
pdf = [
    "weasyprint>=60.0",
]
pdf-hq = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "ruff>=0.1.0",
    "weasyprint>=60.0",
]

[project.scripts]
heiban = "heiban.cli_new:main"

[project.urls]
Homepage = "https://github.com/cycleuser/HeiBan"
Repository = "https://github.com/cycleuser/HeiBan"
Issues = "https://github.com/cycleuser/HeiBan/issues"

[tool.setuptools.dynamic]
version = { attr = "heiban.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["heiban*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
heiban = ["data/lib/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]